name: vitalpet
description: A Flutter app that turns daily symptom logging into a habit using a virtual pet companion.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  # Navigation
  go_router: ^14.0.0

  # Database
  drift: ^2.22.0
  sqlcipher_flutter_libs: ^0.7.0
  drift_flutter: ^0.3.0
  sqlite3_flutter_libs: ^0.6.0

  # On-device SLM (flutter_gemma 2.0.0 not yet on pub.dev; latest is 0.12.7)
  flutter_gemma: ^0.12.7

  # Animations
  confetti: ^0.7.0

  # Health integration
  health: ^12.0.0

  # PDF generation
  pdf: ^3.11.0
  printing: ^5.13.0

  # Notifications
  flutter_local_notifications: ^18.0.0

  # Widget data bridge
  home_widget: ^0.5.0

  # Security / encryption
  flutter_secure_storage: ^9.2.0

  # Immutable data classes
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # SVG rendering (body map)
  flutter_svg: ^2.0.0

  # Crypto utilities
  crypto: ^3.0.0

  # Internationalisation
  intl: ^0.19.0

  # Connectivity (Wi-Fi check before model download)
  connectivity_plus: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.4.0
  riverpod_generator: ^4.0.3
  freezed: ^3.2.5
  drift_dev: ^2.28.0
  json_serializable: ^6.8.0
  mocktail: ^1.0.0
  flutter_lints: ^5.0.0

# Force sqlite3 3.x so that drift_dev 2.28.x works alongside flutter_gemma.
# Remove once upstream packages align their sqlite3 constraints.
dependency_overrides:
  sqlite3: '>=3.1.0 <4.0.0'

flutter:
  uses-material-design: true

  assets:
    - assets/animations/
    - assets/config/
    - assets/fonts/

  # fonts:
  #   - family: AppFont
  #     fonts:
  #       - asset: assets/fonts/AppFont-Regular.ttf
